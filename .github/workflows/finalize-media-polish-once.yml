name: Finalize media polish once

on:
  push:
    branches:
      - website-v2-media-polish
    paths:
      - ".github/workflows/finalize-media-polish-once.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: website-v2-media-polish
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create OA-CBF thumbnail
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -i assets/img/OACBF/overview.webp \
            -vf "crop=iw*0.60:ih:iw*0.40:0,scale=720:-2:flags=lanczos" \
            -frames:v 1 -c:v libwebp -quality 82 assets/img/OACBF/thumb.webp

      - name: Format changed source
        run: |
          npm install --no-save prettier @shopify/prettier-plugin-liquid
          npx prettier \
            _layouts/home-v2.liquid \
            _pages/about.md \
            _projects \
            _sass/_robin-v2.scss \
            .github/workflows/deploy.yml \
            .github/workflows/broken-links.yml \
            --write

      - name: Commit finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/OACBF/thumb.webp _layouts _pages _projects _sass .github/workflows/deploy.yml .github/workflows/broken-links.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "website polish: finalize media and formatting"
            git pull --rebase origin website-v2-media-polish
            git push origin HEAD:website-v2-media-polish
          fi
