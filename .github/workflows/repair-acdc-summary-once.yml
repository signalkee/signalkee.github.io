name: Repair AC-DC summary once

on:
  push:
    branches: [website-final-content-polish]
    paths:
      - ".github/workflows/repair-acdc-summary-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: website-final-content-polish
          fetch-depth: 1

      - name: Reconstruct high-resolution AC-DC summary
        run: |
          set -euo pipefail
          mkdir -p /tmp/acdc-summary assets/img/ACDC
          BASE="https://raw.githubusercontent.com/signalkee/signalkee.github.io/130923c98641f8abe891e04e99c2f7373c166539/.asset_stage_summary"
          for p in part00 part01 part02a part02b part03 part04 part05; do
            curl -fL --retry 4 "$BASE/$p" -o "/tmp/acdc-summary/$p"
          done
          python3 - <<'PY'
          from pathlib import Path
          p = Path("/tmp/acdc-summary/part03")
          s = "".join(p.read_text().split())
          assert len(s) == 13999, len(s)
          s = s[:9222] + "B" + s[9222:]
          assert len(s) == 14000
          p.write_text(s)
          PY
          cat /tmp/acdc-summary/part00 /tmp/acdc-summary/part01 /tmp/acdc-summary/part02a /tmp/acdc-summary/part02b /tmp/acdc-summary/part03 /tmp/acdc-summary/part04 /tmp/acdc-summary/part05 | tr -d '\n\r ' | base64 -d > assets/img/ACDC/summary.webp
          python3 - <<'PY'
          from pathlib import Path
          p=Path("assets/img/ACDC/summary.webp")
          b=p.read_bytes()
          assert b[:4] == b"RIFF" and b[8:12] == b"WEBP", b[:16]
          assert len(b) == 58970, len(b)
          print("summary.webp", len(b), "bytes")
          PY
          file assets/img/ACDC/summary.webp

      - name: Commit repaired summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/ACDC/summary.webp
          git commit -m "website polish: repair AC-DC high-resolution summary"
          git push origin HEAD:website-final-content-polish
