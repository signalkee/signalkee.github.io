name: V2 visual preview once

on:
  push:
    branches:
      - website-v2-redesign
    paths:
      - ".github/workflows/v2-preview-once.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: website-v2-redesign

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true

      - name: Build site
        run: |
          pip3 install --upgrade jupyter
          export JEKYLL_ENV=production
          bundle exec jekyll build

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Render screenshots
        run: |
          mkdir -p preview
          python3 -m http.server 8080 --directory _site >/tmp/v2-http.log 2>&1 &
          sleep 3
          CHROME="$(which chrome || which google-chrome || which chromium || true)"
          echo "Using Chrome: $CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=3000 --window-size=1440,4200 --screenshot=preview/home-desktop.png http://127.0.0.1:8080/
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=3000 --window-size=1440,4200 --screenshot=preview/research-desktop.png "http://127.0.0.1:8080/Researches%20%26%20Projects/"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=3000 --window-size=1440,3200 --screenshot=preview/publications-desktop.png http://127.0.0.1:8080/Publications/
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=3000 --window-size=1440,2200 --screenshot=preview/cv-desktop.png http://127.0.0.1:8080/CV/
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=3000 --window-size=1440,4200 --screenshot=preview/acdc-desktop.png http://127.0.0.1:8080/projects/research-2026-09-21-ACDC/
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=3000 --window-size=390,4200 --screenshot=preview/home-mobile.png http://127.0.0.1:8080/
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=3000 --window-size=390,4200 --screenshot=preview/research-mobile.png "http://127.0.0.1:8080/Researches%20%26%20Projects/"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=3000 --window-size=390,3400 --screenshot=preview/publications-mobile.png http://127.0.0.1:8080/Publications/
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=3000 --window-size=390,4200 --screenshot=preview/acdc-mobile.png http://127.0.0.1:8080/projects/research-2026-09-21-ACDC/

      - name: Upload visual preview
        uses: actions/upload-artifact@v4
        with:
          name: robin-homepage-v2-visual-preview
          path: preview/
          retention-days: 7

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: robin-homepage-v2-built-site
          path: _site/
          retention-days: 7
