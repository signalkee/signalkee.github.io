name: Discover OA-CBF media once

on:
  push:
    branches: [website-media-layout-polish]
    paths:
      - ".github/workflows/discover-oacbf-media-once.yml"

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect OA-CBF page media
        run: |
          set -euo pipefail
          curl -fsSL -A "Mozilla/5.0" https://www.taekyung.me/oa-cbf -o /tmp/oa.html
          echo "=== MEDIA URLS ==="
          python3 - <<'PY'
          import re, html
          s=open('/tmp/oa.html',encoding='utf-8',errors='ignore').read()
          s=html.unescape(s)
          pats=set()
          for m in re.findall(r'https?://[^"\'<> ]+', s):
              if any(k in m.lower() for k in ['gif','mp4','webm','oopy.lazyrockets','prod-files-secure']):
                  pats.add(m)
          for x in sorted(pats):
              print(x)
          print("=== CONTEXT ===")
          low=s.lower()
          for key in ['quad3d','dpcbf','kinematic bicycle','top-down']:
              print("\nKEY",key)
              start=0
              while True:
                  i=low.find(key,start)
                  if i<0: break
                  print(s[max(0,i-700):i+1800].replace('\n',' ')[:2500])
                  start=i+len(key)
          PY
