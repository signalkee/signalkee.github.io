name: Temporary CV PDF content check

on:
  push:
    branches: [final-content-audit-20260930]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract CV text
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdftotext -layout assets/pdf/robin-inho-kee-cv.pdf /tmp/cv.txt
          echo "----- CV TEXT BEGIN -----"
          cat /tmp/cv.txt
          echo "----- CV TEXT END -----"

      - name: Upload CV PDF
        uses: actions/upload-artifact@v4
        with:
          name: current-cv-pdf
          path: assets/pdf/robin-inho-kee-cv.pdf
          retention-days: 1
