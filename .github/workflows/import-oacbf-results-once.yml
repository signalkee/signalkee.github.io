name: Import OA-CBF result media once
# rerun after page-polish commit

on:
  push:
    branches: [website-media-layout-polish]
    paths:
      - ".github/workflows/import-oacbf-results-once.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: website-media-layout-polish
          fetch-depth: 1

      - name: Download official OA-CBF media
        run: |
          set -euo pipefail
          mkdir -p /tmp/oacbf assets/media/oacbf
          UA="Mozilla/5.0"
          REF="https://www.taekyung.me/oa-cbf"
          curl -fL --retry 3 -A "$UA" -H "Referer: $REF"             'https://oopy.lazyrockets.com/api/v2/notion/image?src=attachment%3A7a9d5c40-97db-4b29-8477-462c20d32b01%3AOA-CBFHomepage-ezgif.com-optimize.gif&blockId=36618d5c-31e3-8046-ad59-efe36f7bca7d'             -o /tmp/oacbf/quad3d-topdown.gif
          curl -fL --retry 3 -A "$UA" -H "Referer: $REF"             'https://oopy.lazyrockets.com/api/v2/notion/fileUrl?src=attachment%3A1b7d8698-db47-4754-9cc2-5e83e7abc97e%3Aquad3d.mp4&blockId=36618d5c-31e3-800c-b2a0-fbebb7c71d10'             -o /tmp/oacbf/quad3d-unified.mp4
          curl -fL --retry 3 -A "$UA" -H "Referer: $REF"             'https://oopy.lazyrockets.com/api/v2/notion/fileUrl?src=attachment%3A10abef03-9dec-4f8d-8fc0-714a2080f2fd%3Aquad3d_ours.mp4&blockId=36618d5c-31e3-80b4-8275-d25cca44d407'             -o /tmp/oacbf/quad3d-oacbf.mp4
          curl -fL --retry 3 -A "$UA" -H "Referer: $REF"             'https://oopy.lazyrockets.com/api/v2/notion/fileUrl?src=attachment%3A56c741ca-942c-477b-abc1-2cb13b45b4ba%3Akinematic_bicycle.mp4&blockId=36618d5c-31e3-80bb-8d74-c732832de4d7'             -o /tmp/oacbf/dpcbf-unified.mp4
          curl -fL --retry 3 -A "$UA" -H "Referer: $REF"             'https://oopy.lazyrockets.com/api/v2/notion/fileUrl?src=attachment%3A14fc9ed8-fb82-4c5a-a121-ecfcdc8d4db0%3Akinematic_bicycle_ours.mp4&blockId=36618d5c-31e3-8069-afe3-fc1ecda50c33'             -o /tmp/oacbf/dpcbf-oacbf.mp4
          file /tmp/oacbf/*

      - name: Optimize and create posters
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -y -loglevel error -i /tmp/oacbf/quad3d-topdown.gif             -vf "fps=18,scale='min(760,iw)':-2:flags=lanczos" -an -c:v libx264 -crf 27 -preset medium -pix_fmt yuv420p -movflags +faststart             assets/media/oacbf/quad3d-topdown.mp4
          ffmpeg -y -loglevel error -i /tmp/oacbf/quad3d-topdown.gif -frames:v 1             -vf "scale='min(760,iw)':-2:flags=lanczos" -c:v libwebp -quality 82 assets/media/oacbf/quad3d-topdown.webp
          for name in quad3d-unified quad3d-oacbf dpcbf-unified dpcbf-oacbf; do
            ffmpeg -y -loglevel error -i "/tmp/oacbf/$name.mp4"               -vf "scale='min(1100,iw)':-2:flags=lanczos" -an -c:v libx264 -crf 25 -preset medium -pix_fmt yuv420p -movflags +faststart               "assets/media/oacbf/$name.mp4"
            ffmpeg -y -loglevel error -ss 0.2 -i "/tmp/oacbf/$name.mp4" -frames:v 1               -vf "scale='min(1100,iw)':-2:flags=lanczos" -c:v libwebp -quality 82 "assets/media/oacbf/$name.webp"
          done
          ls -lh assets/media/oacbf

      - name: Commit imported media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/media/oacbf
          git commit -m "website polish: add OA-CBF Quad3D and DPCBF media"
          git push origin HEAD:website-media-layout-polish
