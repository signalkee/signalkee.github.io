name: Repair CCTA architecture once

on:
  push:
    branches: [website-final-content-polish]
    paths:
      - ".github/workflows/repair-ccta-architecture-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: website-final-content-polish
          fetch-depth: 1

      - name: Reconstruct CCTA architecture
        run: |
          set -euo pipefail
          mkdir -p assets/img/CCTA
          cat .asset_stage_ccta_arch/part00 .asset_stage_ccta_arch/part01 .asset_stage_ccta_arch/part02 .asset_stage_ccta_arch/part03 | tr -d '\n\r ' | base64 -d > assets/img/CCTA/control-architecture.webp
          python3 - <<'PY'
          from pathlib import Path
          p = Path("assets/img/CCTA/control-architecture.webp")
          b = p.read_bytes()
          assert b[:4] == b"RIFF" and b[8:12] == b"WEBP", b[:16]
          assert len(b) == 14570, len(b)
          print(p, len(b), "bytes")
          PY
          file assets/img/CCTA/control-architecture.webp

      - name: Commit repaired architecture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/CCTA/control-architecture.webp
          git commit -m "website polish: repair CCTA control architecture"
          git push origin HEAD:website-final-content-polish
