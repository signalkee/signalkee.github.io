name: Install AC-DC figure once

on:
  push:
    branches:
      - website-v2-media-polish
    paths:
      - ".github/workflows/install-acdc-figure-once.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: website-v2-media-polish

# staged chunks repaired
      - name: Decode AC-DC summary figure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/img/ACDC
          cat .media_stage/acdc_part*.txt | base64 -d > assets/img/ACDC/summary.webp
          echo "eb11ed06abe5360ad4e9611b44174ab5637b0c14c8f71e2f488a04953cb4b74c  assets/img/ACDC/summary.webp" | sha256sum -c -
          file assets/img/ACDC/summary.webp
          ls -lh assets/img/ACDC/summary.webp

      - name: Commit AC-DC summary figure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/ACDC/summary.webp
          git commit -m "website v2: add AC-DC summary figure"
          git pull --rebase origin website-v2-media-polish
          git push origin HEAD:website-v2-media-polish
