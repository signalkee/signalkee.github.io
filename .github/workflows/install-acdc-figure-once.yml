name: Install AC-DC source figure once

on:
  push:
    branches:
      - website-v2-media-polish
    paths:
      - ".github/workflows/install-acdc-figure-once.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: website-v2-media-polish
          fetch-depth: 0

      - name: Reconstruct source figure
        run: |
          set -euo pipefail
          cat .asset_stage/acdc.part* > /tmp/acdc.b64
          base64 -d /tmp/acdc.b64 > assets/img/ACDC/summary.webp
          file assets/img/ACDC/summary.webp
          test "$(stat -c%s assets/img/ACDC/summary.webp)" -gt 12000

      - name: Commit source figure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/ACDC/summary.webp
          git commit -m "website polish: install AC-DC source figure"
          git pull --rebase origin website-v2-media-polish
          git push origin HEAD:website-v2-media-polish
