name: Format V2 CV once

on:
  push:
    branches:
      - website-v2-redesign
    paths:
      - ".github/workflows/v2-format-cv-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: website-v2-redesign
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Format updated CV files
        run: |
          npm install --no-save prettier @shopify/prettier-plugin-liquid
          npx prettier _pages/cv.md _sass/_robin-v2-requested.scss --write
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _pages/cv.md _sass/_robin-v2-requested.scss
          if git diff --cached --quiet; then
            echo "Already formatted."
          else
            git commit -m "website v2: format latest CV refresh"
            git pull --rebase origin website-v2-redesign
            git push origin HEAD:website-v2-redesign
          fi
