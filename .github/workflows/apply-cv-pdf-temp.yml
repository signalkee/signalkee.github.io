name: Apply final CV PDF corrections

on:
  push:
    branches: [final-content-audit-20260930]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: final-content-audit-20260930
          fetch-depth: 0

      - name: Install PDF tooling
        run: |
          python3 -m pip install --user --break-system-packages pymupdf
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Patch and verify CV PDF
        run: |
          set -euo pipefail
          python3 scripts/patch_cv_temp.py
          pdftotext -layout assets/pdf/robin-inho-kee-cv.pdf /tmp/cv.txt
          grep -Fq "Disentangled Prototypical Convolutional Network for Few-Shot Learning in In-Vehicle Noise Classification." /tmp/cv.txt
          grep -Fq "W. Jo, S. Hwang, I. Kee, I. Lee, and S. Lee." /tmp/cv.txt
          grep -Fq "S.-J. Buu." /tmp/cv.txt
          grep -Fq "reduced mean paired AUC by 29.5% and 24.5%" /tmp/cv.txt
          grep -Fq "5.8× and 11.5× as much modeled payload" /tmp/cv.txt

      - name: Remove temporary audit files
        run: |
          git rm -f scripts/patch_cv_temp.py
          git rm -f .github/workflows/apply-cv-pdf-temp.yml
          git rm -f .github/workflows/cv-content-check-temp.yml

      - name: Commit corrected CV PDF
        run: |
          git add assets/pdf/robin-inho-kee-cv.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Correct CV PDF content"
          git push origin HEAD:final-content-audit-20260930
