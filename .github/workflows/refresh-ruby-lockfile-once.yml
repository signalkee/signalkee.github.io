name: Refresh Ruby lockfile once

on:
  push:
    branches: [repo-maintenance-cleanup]
    paths:
      - ".github/workflows/refresh-ruby-lockfile-once.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repo-maintenance-cleanup
          fetch-depth: 1
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
      - name: Refresh Gemfile.lock
        run: |
          gem install bundler
          bundle lock
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemfile.lock
          if git diff --cached --quiet; then
            echo "Gemfile.lock already current."
          else
            git commit -m "maintenance: refresh Ruby lockfile"
            git push origin HEAD:repo-maintenance-cleanup
          fi
