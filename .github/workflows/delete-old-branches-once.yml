name: Delete merged website branches once

on:
  push:
    branches: [repo-maintenance-cleanup]
    paths:
      - ".github/workflows/delete-old-branches-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Delete superseded website branches
        run: |
          set -euo pipefail
          for branch in             website-v2-redesign             website-v2-media-polish             website-final-content-polish             website-media-layout-polish
          do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            else
              echo "$branch already absent"
            fi
          done
