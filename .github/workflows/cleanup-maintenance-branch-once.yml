name: Cleanup maintenance branch once

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/cleanup-maintenance-branch-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Delete maintenance branch
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin repo-maintenance-cleanup >/dev/null 2>&1; then
            git push origin --delete repo-maintenance-cleanup
          else
            echo "repo-maintenance-cleanup already absent"
          fi

      - name: Remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/cleanup-maintenance-branch-once.yml
          git add .github/workflows/cleanup-maintenance-branch-once.yml
          git commit -m "maintenance: remove one-time branch cleanup"
          git push origin HEAD:master
