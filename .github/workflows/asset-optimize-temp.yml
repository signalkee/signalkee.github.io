name: Temporary asset optimization

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          npm ci
          npx prettier _includes/header.liquid _sass/_site.scss --write

      - name: Convert large images to WebP
        shell: bash
        run: |
          set -euo pipefail

          optimize() {
            src="$1"
            dst="$2"
            if [ ! -f "$src" ]; then
              echo "skip missing: $src"
              return
            fi

            mkdir -p "$(dirname "$dst")"
            convert "$src" -strip -quality 92 "$dst"
            identify "$src" "$dst"
            echo "$(du -h "$src" | cut -f1) -> $(du -h "$dst" | cut -f1): $src"

            grep -RIl --exclude-dir=.git --exclude='*.webp' -- "$src" . | while read -r file; do
              sed -i "s|$src|$dst|g" "$file"
            done

            git rm "$src"
            git add "$dst"
          }

          optimize "assets/img/kist/KIST_system.png" "assets/img/kist/system.webp"
          optimize "assets/img/kist/KIST_model.png" "assets/img/kist/model.webp"
          optimize "assets/img/kist/KIST_result.png" "assets/img/kist/result.webp"
          optimize "assets/img/sport/Sport_feedback.png" "assets/img/sport/feedback.webp"
          optimize "assets/img/sport/Sport_setup.png" "assets/img/sport/setup.webp"
          optimize "assets/img/rem2/REM2_lab.jpg" "assets/img/rem2/lab.webp"
          optimize "assets/img/rem2/REM2_setup.png" "assets/img/rem2/setup.webp"
          optimize "assets/img/roboin/Rob_selfbal.jpg" "assets/img/roboin/self-balancing.webp"
          optimize "assets/img/roboin/Rob_edpic.jpg" "assets/img/roboin/line-tracer.webp"
          optimize "assets/img/roboin-fire/Fire_session.jpg" "assets/img/roboin-fire/development.webp"
          optimize "assets/img/roboin-fire/Fire_title.jpg" "assets/img/roboin-fire/overview.webp"
          optimize "assets/img/roboin-teo/Teo_system.jpg" "assets/img/roboin-teo/system.webp"
          optimize "assets/img/scitech-2025/Diagram_closed_loop.png" "assets/img/scitech-2025/closed-loop.webp"
          optimize "assets/img/softcomp/Soft_title.png" "assets/img/softcomp/title.webp"
          optimize "assets/img/roboin/room.jpg" "assets/img/roboin/room.webp"
          optimize "assets/img/roboin/drone.jpg" "assets/img/roboin/drone.webp"
          optimize "assets/img/idim/smart-lab.png" "assets/img/idim/smart-lab.webp"
          optimize "assets/img/softcomp/few-shot-overview.png" "assets/img/softcomp/few-shot-overview.webp"
          optimize "assets/img/softcomp/continual-learning-overview.png" "assets/img/softcomp/continual-learning-overview.webp"
          optimize "assets/img/nemd/fabrication.png" "assets/img/nemd/fabrication.webp"
          optimize "assets/img/nemd/intro.png" "assets/img/nemd/intro.webp"
          optimize "assets/img/nemd/title.png" "assets/img/nemd/title.webp"
          optimize "assets/img/roboin-teo/prototype.jpg" "assets/img/roboin-teo/prototype.webp"
          optimize "assets/img/kbd/overview.png" "assets/img/kbd/overview.webp"
          optimize "assets/img/kbd/system-schematic.png" "assets/img/kbd/system-schematic.webp"
          optimize "assets/img/roboin-fire/soscon.jpg" "assets/img/roboin-fire/soscon.webp"

          git add _projects _pages _layouts _data _includes _sass || true

      - name: Commit optimized assets
        run: |
          if git diff --cached --quiet; then
            echo "No asset changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Optimize large project images"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
