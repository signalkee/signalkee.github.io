name: Media polish visual QA once
# final rerun with source AC-DC figure

on:
  push:
    branches:
      - website-v2-media-polish
    paths:
      - ".github/workflows/media-polish-visual-qa-once.yml"

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: website-v2-media-polish

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true

      - name: Build site
        run: |
          export JEKYLL_ENV=production
          bundle exec jekyll build

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Render screenshots
        run: |
          python3 -m http.server 8080 --directory _site >/tmp/site.log 2>&1 &
          sleep 2
          CHROME="$(which chrome || which google-chrome || which chromium)"
          mkdir -p preview
          render() {
            name="$1"; size="$2"; url="$3"
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=2500 --window-size="$size" --screenshot="preview/$name.png" "http://127.0.0.1:8080$url"
          }
          render home-desktop 1440,3600 /
          render home-mobile 390,4200 /
          render research-desktop 1440,5200 "/Researches%20%26%20Projects/"
          render publications-desktop 1440,4200 /Publications/
          render publications-mobile 390,5000 /Publications/
          render cv-desktop 1440,5200 /CV/
          render acdc-desktop 1440,5000 /projects/research-2026-09-21-ACDC/
          render oa-cbf-desktop 1440,5200 /projects/research-2026-04-01-OA-CBF/
          render ccta-desktop 1440,5200 /projects/research-2024-05-01-VODCA-ACC/
          render ccta-mobile 390,5200 /projects/research-2024-05-01-VODCA-ACC/
          render icra-desktop 1440,6200 /projects/research-2024-02-01-Panagou-ICRA/
          render kist-desktop 1440,5200 /projects/work-2022-07-01-KIST/
          render fire-desktop 1440,5200 /projects/roboin-2019-01-01-AutoFire/
          render early-desktop 1440,6200 /projects/roboin-2019-01-01-etc/

      - uses: actions/upload-artifact@v4
        with:
          name: media-polish-visual-qa
          path: preview
          retention-days: 7
