name: Format maintenance files once

on:
  push:
    branches: [repo-maintenance-cleanup]
    paths:
      - ".github/workflows/format-maintenance-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repo-maintenance-cleanup
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Format touched files
        run: npx prettier _sass/_robin-v2.scss assets/js/common.js --write
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _sass/_robin-v2.scss assets/js/common.js
          if git diff --cached --quiet; then
            echo "Already formatted."
          else
            git commit -m "maintenance: format cleanup changes"
            git push origin HEAD:repo-maintenance-cleanup
          fi
